plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.bycoda'
version = '1.0.0'
android {
  namespace 'expo.modules.bycodafold'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
dependencies {
  implementation 'androidx.window:window:1.3.0'
  implementation 'androidx.window:window-java:1.3.0'
}
